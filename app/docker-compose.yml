services:
  db:
    image: postgres:16-alpine
    container_name: roam-trip-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: roam
      POSTGRES_PASSWORD: roam
      POSTGRES_DB: roam_trip_booking
    ports:
      - "5432:5432"
    volumes:
      - roam-trip-booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roam -d roam_trip_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: roam-trip-booking-api
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://roam:roam@db:5432/roam_trip_booking
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret}
      CHAOS_LATENCY: ${CHAOS_LATENCY:-false}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  roam-trip-booking-db-data:
